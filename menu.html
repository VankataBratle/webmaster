<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меню | Пекарни Желеви</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #121212; color: #fdfbf7; font-family: 'Poppins', sans-serif; }
        
        .hero-banner { 
            text-align: center; padding: 100px 20px; 
            background: linear-gradient(rgba(18,18,18,0.7), rgba(18,18,18,0.7)), url('https://images.unsplash.com/photo-1555507036-ab1e4006aaeb?auto=format&fit=crop&w=1600&q=80') center/cover;
        }
        h1 { font-family: 'Playfair Display', serif; font-size: 3.5em; color: #d4af37; }
        
        .menu-section { max-width: 1000px; margin: 50px auto; padding: 20px; }
        h2 { font-family: 'Playfair Display', serif; color: #d4af37; text-align: center; margin-bottom: 30px; font-size: 2em; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        
        .card { background: #1e1e1e; border-radius: 15px; overflow: hidden; border: 1px solid #333; }
        .card img { width: 100%; height: 200px; object-fit: cover; display: block; }
        .info { padding: 20px; }
        .info h3 { color: #f5d78d; margin-bottom: 10px; }
        .price { color: #d4af37; font-weight: bold; font-size: 1.2em; display: block; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="hero-banner">
        <h1>Нашето Меню</h1>
    </div>

    <div class="menu-section">
        <h2>Традиционен Хляб</h2>
        <div class="grid">
            <div class="card">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/71/An_artisan_loaf_of_sourdough_bread.jpg/640px-An_artisan_loaf_of_sourdough_bread.jpg" alt="Хляб">
                <div class="info">
                    <h3>Селски хляб с квас</h3>
                    <span class="price">€1.28</span>
                </div>
            </div>
            <div class="card">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/42/Whole_wheat_bread.jpg/640px-Whole_wheat_bread.jpg" alt="Хляб">
                <div class="info">
                    <h3>Пълнозърнест хляб</h3>
                    <span class="price">€1.12</span>
                </div>
            </div>
        </div>

        <h2 style="margin-top: 50px;">Топли Закуски</h2>
        <div class="grid">
            <div class="card">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e2/Banitsa_with_cheese.jpg/640px-Banitsa_with_cheese.jpg" alt="Баница">
                <div class="info">
                    <h3>Домашна баница</h3>
                    <span class="price">€1.43</span>
                </div>
            </div>
            <div class="card">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/28/Croissants.jpg/640px-Croissants.jpg" alt="Кроасани">
                <div class="info">
                    <h3>Маслени кроасани</h3>
                    <span class="price">€1.02</span>
                </div>
            </div>
            <div class="card">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/50/Mekitsi.jpg/640px-Mekitsi.jpg" alt="Мекици">
                <div class="info">
                    <h3>Пухкави мекици</h3>
                    <span class="price">€1.23</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
