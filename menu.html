<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меню | Пекарни Желеви</title>
    <style>
        body { background-color: #121212; color: #fdfbf7; font-family: sans-serif; margin: 0; padding: 20px; }
        .menu-section { max-width: 1000px; margin: 0 auto; }
        h2 { color: #d4af37; text-align: center; margin: 40px 0; font-size: 2.5em; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .card { background: #1e1e1e; border-radius: 15px; overflow: hidden; border: 1px solid #333; }
        .card img { width: 100%; height: 200px; object-fit: cover; display: block; }
        .info { padding: 20px; }
        .info h3 { color: #f5d78d; margin-bottom: 5px; }
        .price { color: #d4af37; font-weight: bold; font-size: 1.2em; display: block; margin-top: 10px; }
    </style>
</head>
<body>

<div class="menu-section">
    <h2>Топли Закуски</h2>
    <div class="grid">
        <div class="card">
            <!-- Директен работещ линк -->
            <img src="https://images.pexels.com/photos/5639433/pexels-photo-5639433.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Баница">
            <div class="info">
                <h3>Домашна баница</h3>
                <span class="price">€1.43</span>
            </div>
        </div>
        <div class="card">
            <!-- Директен работещ линк -->
            <img src="https://images.pexels.com/photos/1036798/pexels-photo-1036798.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Кроасани">
            <div class="info">
                <h3>Маслени кроасани</h3>
                <span class="price">€1.02</span>
            </div>
        </div>
        <div class="card">
            <!-- Директен работещ линк -->
            <img src="https://images.pexels.com/photos/5848527/pexels-photo-5848527.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Мекици">
            <div class="info">
                <h3>Пухкави мекици</h3>
                <span class="price">€1.23</span>
            </div>
        </div>
    </div>
</div>

</body>
</html>
